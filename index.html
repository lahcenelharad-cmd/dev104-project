<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev-104 Project</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

header{
    background:rgba(0,0,0,.3);
    padding:20px;
    text-align:center;
    font-size:28px;
    backdrop-filter:blur(10px);
}

.container{
    display:flex;
    min-height:80vh;
}

aside{
    width:220px;
    background:rgba(0,0,0,.4);
    padding:20px;
}

aside h2{
    margin-bottom:20px;
}

aside ul{
    list-style:none;
}

aside li{
    padding:15px;
    border-radius:10px;
    transition:.3s;
    cursor:pointer;
}

aside li:hover{
    background:white;
    color:#333;
}

main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hello{
    font-size:55px;
    animation:zoom 2s infinite;
}

.name{
    font-size:32px;
    margin-top:15px;
    animation:slide 2s infinite alternate;
}

button{
    margin-top:35px;
    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:white;
    color:#0077ff;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

.clock{
    margin-top:20px;
    font-size:24px;
}

footer{
    background:rgba(0,0,0,.3);
    text-align:center;
    padding:20px;
}

@keyframes zoom{
0%{transform:scale(1);}
50%{transform:scale(1.15);}
100%{transform:scale(1);}
}

@keyframes slide{
from{transform:translateX(-40px);}
to{transform:translateX(40px);}
}

@media(max-width:768px){
.container{
flex-direction:column;
}

aside{
width:100%;
}
}
</style>

</head>
<body>

<header>
<h1>Mon Projet Web</h1>
</header>

<div class="container">

<aside>
<h2>Menu</h2>
<ul>
<li>🏠 Accueil</li>
<li>👤 À propos</li>
<li>💻 Dev-104</li>
<li>📞 Contact</li>
</ul>
</aside>

<main>

<h1 class="hello">Hello Dev-104 👋</h1>

<h2 class="name">Lahcen Elharad</h2>

<button onclick="changeColor()">Changer la couleur</button>

<div class="clock" id="clock"></div>

</main>

</div>

<footer>
© 2026 - Projet Dev-104 OFPPT
</footer>

<script>

function changeColor(){

const colors=[
"#ff0000",
"#00ff00",
"#ffff00",
"#00ffff",
"#ff00ff",
"#ffffff"
];

document.querySelector(".hello").style.color=
colors[Math.floor(Math.random()*colors.length)];

}

function updateClock(){

const now=new Date();

document.getElementById("clock").innerHTML=
now.toLocaleTimeString();

}

setInterval(updateClock,1000);

updateClock();

</script>

</body>
</html>
